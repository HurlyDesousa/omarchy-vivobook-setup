# omarchy-sleep-lock.service holds a delay inhibitor so the session is locked
# before the machine suspends. A delay inhibitor is a timer, not a promise:
# logind suspends anyway once the window expires, locked or not.
#
# Vivobook: lid-close often reconfigures eDP+HDMI. Keep 30s so sleep-lock can
# finish. A healthy lock still releases as soon as the session reports secure.
[Login]
InhibitDelayMaxSec=30
